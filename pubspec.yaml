name: mediasfu_sdk
description: "Flutter WebRTC SDK for video conferencing, webinars, live streaming, chat, whiteboards, recording, translation, and AI-powered meeting apps with MediaSFU."
version: 2.4.3
homepage: https://www.mediasfu.com
repository: https://github.com/MediaSFU/MediaSFU_SDK_Flutter
issue_tracker: https://github.com/MediaSFU/MediaSFU_SDK_Flutter/issues
documentation: https://www.mediasfu.com/docs/sdks/flutter/
topics:
  - webrtc
  - video-call
  - video-conferencing
  - live-streaming
  - telehealth

screenshots:
  - description: Live four-participant video conference built with the prebuilt Flutter room.
    path: screenshots/conference-grid-dark.png
  - description: Shared whiteboard in a live conference.
    path: screenshots/conference-whiteboard.png
  - description: Live poll with votes and results beside the video grid.
    path: screenshots/conference-polls.png

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

# Keep pub.dev's platform badges aligned with tested SDK integrations.
# This explicit list replaces pub.dev's inferred platform list.
platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  web:

dependencies:
  flutter:
    sdk: flutter
  socket_io_client: ^3.1.6
  url_launcher: ^6.3.2
  clipboard: ^3.0.14
  flutter_colorpicker: ^1.1.0
  mediasfu_mediasoup_client: ^0.1.4
  http: ^1.6.0
  intl: ^0.20.3
  font_awesome_flutter: ^11.0.0
  shared_preferences: ^2.5.5
  flutter_webrtc: ^1.6.2+hotfix.3
  audioplayers: ^6.7.1
  collection: ^1.19.1
  # Background modal & image handling (cross-platform)
  image_picker: ^1.2.3
  cached_network_image: ^3.4.1
  path_provider: ^2.1.6
  # Whiteboard dependencies (cross-platform)
  path_drawing: ^1.0.1
  share_plus: ^13.2.1
  # Web whiteboard canvas capture (transitive deps made explicit)
  web: ^1.1.1
  dart_webrtc: ^1.8.1
  
  # ============================================================
  # PLATFORM-SPECIFIC DEPENDENCIES
  # These are active in the GitHub version for full functionality.
  # When publishing to pub.dev, run: dart scripts/prepare_publish.dart
  # This comments them out so pub.dev shows all platform support.
  # Users add them back based on their target platforms.
  # ============================================================
  
  # Virtual Backgrounds (Android/iOS only)
  # Enables ML Kit selfie segmentation for blur/image backgrounds
  # google_mlkit_selfie_segmentation: ^0.10.0  # COMMENTED FOR PUB.DEV


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  dartdoc: ^9.0.1


flutter:
  uses-material-design: true
  assets:
  - assets/whatsapp.jpg
  - assets/logo192.png
  fonts:
    - family: FontAwesome
      fonts:
        - asset: fonts/FontAwesome.ttf
